# The dsh-model-relay bundle patch.
#
# This file deliberately patches NOTHING on the `connection` row.
#
# It used to restate `inject: [webRuntime, webServer]`, on the theory that the
# settings page's RPC channel needs Connection to be given the Web server
# dependency. That was actively harmful on DSH 0.1.2-rc.1, and the reason is a
# loader semantic that is easy to misread:
#
#   Loader patches REPLACE a targeted row's whole value
#   (`target[key] = value` in dsh-app-boot's applyEntryPatches), they do not
#   merge into it. So restating `inject` here does not ADD `webServer` to
#   whatever the other bundles asked for — it DELETES everything else.
#
# On 0.1.2-rc.1 the composed tree already patches this row (dsh-webgate:
# `inject: [webRuntime, lanAccessHosts]`, plus its `trustedHosts` expression),
# and the connection plugin itself declares `inject: [webServer, credentials]`
# and reads `ctx.credentials` directly. Overriding the row therefore dropped
# BOTH `credentials` and `lanAccessHosts`, which fails Connection at startup —
# taking down the whole `/api` carrier and the Web UI with it, not just this
# plugin's settings page.
#
# Connection is composed by the bundle stack, not by this plugin. A plugin
# consumes a service; it does not get to define that service's dependencies.

- insert:
    - id: dsh-model-relay
      name: 'dsh-model-relay'
      # No config ships here on purpose. The gateway defaults to loopback only,
      # which is the safe default for anyone installing this bundle.
      #
      # To reach it from other devices on the LAN, opt in from YOUR profile's
      # own patch layer (profiles/<name>/cordis.patch.yml), which is applied
      # after every bundle and therefore wins:
      #
      #   - id: dsh-model-relay
      #     inject: [llm, webServer]
      #     config:
      #       lanPort: 3081
      #
      # Create an API key first: the LAN listener otherwise accepts every
      # device on the network.
